<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidrah Fashion — Image Tagger</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafaf8; color: #1a1a1a; }
  header { background: #1a1a1a; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  #progress { font-size: 12px; color: #aaa; }
  #export-btn { background: #a3b18a; color: #fff; border: none; padding: 8px 20px; cursor: pointer; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
  #export-btn:hover { background: #8a9a72; }

  #products-panel { position: fixed; right: 0; top: 53px; bottom: 0; width: 300px; background: #fff; border-left: 1px solid #e0e0da; overflow-y: auto; padding: 16px; z-index: 50; }
  #products-panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #999; margin-bottom: 12px; }
  .product-btn { display: block; width: 100%; text-align: left; background: none; border: 1px solid #e0e0da; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; font-size: 13px; transition: background .15s; }
  .product-btn:hover { background: #f0f4ec; border-color: #a3b18a; }
  .product-btn .p-name { font-weight: 600; display: block; }
  .product-btn .p-meta { font-size: 11px; color: #888; margin-top: 2px; }
  .product-btn.selected { background: #a3b18a22; border-color: #a3b18a; }
  .skip-btn { display: block; width: 100%; text-align: left; background: none; border: 1px dashed #ccc; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; font-size: 12px; color: #999; }
  .skip-btn:hover { border-color: #999; color: #555; }

  main { margin-right: 300px; padding: 24px; }
  .group-card { background: #fff; border: 2px solid #e0e0da; border-radius: 6px; margin-bottom: 24px; overflow: hidden; transition: border-color .2s; }
  .group-card.assigned { border-color: #a3b18a; }
  .group-card.skipped { border-color: #f0c040; opacity: .7; }
  .group-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #f5f5f2; border-bottom: 1px solid #e0e0da; }
  .group-num { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #999; }
  .group-ts { font-size: 12px; color: #555; }
  .assignment-badge { font-size: 11px; font-weight: 700; color: #4a7a30; background: #e8f5e0; padding: 3px 10px; border-radius: 12px; }
  .skip-badge { font-size: 11px; font-weight: 700; color: #a07000; background: #fff8e0; padding: 3px 10px; border-radius: 12px; }
  .images-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
  .img-thumb { width: 160px; height: 200px; object-fit: contain; background: #f0f0ec; border-radius: 3px; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
  .img-thumb:hover { border-color: #a3b18a; }
  .img-thumb.zoomed-active { border-color: #1a1a1a; }
  .filename { font-size: 10px; color: #bbb; padding: 0 16px 10px; word-break: break-all; }
  .action-row { display: flex; gap: 8px; padding: 8px 16px 14px; flex-wrap: wrap; }
  .assign-btn-inline { font-size: 11px; background: #f0f4ec; border: 1px solid #a3b18a; color: #3a5a20; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
  .assign-btn-inline:hover { background: #a3b18a; color: #fff; }
  .skip-btn-inline { font-size: 11px; background: #fffbf0; border: 1px solid #f0c040; color: #806000; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
  .skip-btn-inline:hover { background: #f0c040; color: #fff; }
  .clear-btn-inline { font-size: 11px; background: #fdf0f0; border: 1px solid #e09090; color: #a04040; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
  .clear-btn-inline:hover { background: #e09090; color: #fff; }

  /* Lightbox */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 200; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
  #lightbox-close { position: absolute; top: 16px; right: 24px; color: #fff; font-size: 32px; cursor: pointer; background: none; border: none; }

  /* Export output */
  #output-area { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 300; align-items: center; justify-content: center; }
  #output-area.open { display: flex; }
  #output-box { background: #fff; border-radius: 6px; width: 90vw; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; }
  #output-box h2 { padding: 16px 20px; font-size: 14px; border-bottom: 1px solid #eee; }
  #output-json { flex: 1; overflow-y: auto; padding: 16px 20px; font-family: monospace; font-size: 12px; white-space: pre-wrap; background: #fafafa; }
  .output-actions { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
  .copy-btn { background: #a3b18a; color: #fff; border: none; padding: 8px 20px; cursor: pointer; border-radius: 3px; font-size: 13px; }
  .close-output-btn { background: #eee; border: none; padding: 8px 20px; cursor: pointer; border-radius: 3px; font-size: 13px; }
  .note { font-size: 12px; color: #888; padding: 8px 20px 0; }
</style>
</head>

</header>

<aside id="products-panel">

<main id="main-content"></main>

<div id="lightbox">

</div>

const { groups, keys } = GROUPS_DATA;

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  // Load catalog.json relative to this file (tools/../src/data/catalog.json)
  try {
    const res = await fetch('../src/data/catalog.json');
    PRODUCTS = await res.json();
  } catch(e) {
    alert('Could not load src/data/catalog.json. Make sure the dev server is running at localhost:3000 and open this page via the dev server.');
    return;
  }

  renderProductPanel();
  renderGroups();
  updateProgress();
}

// ── Product panel ─────────────────────────────────────────────────────────────
function renderProductPanel() {
  const el = document.getElementById('product-list');
  el.innerHTML = PRODUCTS.map(p => `
    <button class="product-btn" id="pbtn-${p.id}" onclick="selectProduct('${p.id}')">
      <span class="p-name">${p.name}</span>
      <span class="p-meta">${p.brandSlug} · ${p.category}${p.subcategory ? ' / '+p.subcategory : ''}</span>
      <span class="p-meta">₹${p.price ?? '?'} · set ${p.setQuantity ?? '?'}</span>
    </button>
  `).join('') + `<button class="skip-btn" onclick="selectProduct('skip')">⊘ Mark as unmatched / skip</button>`;
}

let selectedProduct = null;
function selectProduct(id) {
  selectedProduct = id;
  document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('selected'));
  if (id !== 'skip') {
    const btn = document.getElementById('pbtn-'+id);
    if (btn) btn.classList.add('selected');
  }
}

// ── Group rendering ────────────────────────────────────────────────────────────
function renderGroups() {
  const main = document.getElementById('main-content');
  main.innerHTML = keys.map((key, i) => {
    const imgs = groups[key];
    return `
      <div class="group-card" id="gc-${i}" data-key="${key}">
        <div class="group-header">
          <span class="group-num">Group ${i+1} of ${keys.length} · ${imgs.length} image${imgs.length>1?'s':''}</span>
          <span class="group-ts">${key.replace('WhatsApp Image ','')}</span>
          <span id="badge-${i}"></span>
        </div>
        <div class="images-row">
          ${imgs.map(f => `
            <img class="img-thumb"
              src="${IMAGE_BASE}${encodeURIComponent(f)}"
              title="${f}"
              onclick="openLightbox('${IMAGE_BASE}${encodeURIComponent(f)}')"
              loading="lazy"
            >
          `).join('')}
        </div>
        <div class="filename">${imgs.join('<br>')}</div>
        <div class="action-row">
          ${PRODUCTS.map(p => `
            <button class="assign-btn-inline" onclick="assignGroup(${i},'${key}','${p.id}')">
              ${p.brandSlug} · ${p.name}
            </button>
          `).join('')}
          <button class="skip-btn-inline" onclick="assignGroup(${i},'${key}','skip')">Skip</button>
          <button class="clear-btn-inline" onclick="clearGroup(${i},'${key}')">Clear</button>
        </div>
      </div>
    `;
  }).join('');
}

function assignGroup(i, key, productId) {
  assignments[key] = productId;
  const card = document.getElementById('gc-'+i);
  const badge = document.getElementById('badge-'+i);
  card.className = 'group-card ' + (productId === 'skip' ? 'skipped' : 'assigned');
  if (productId === 'skip') {
    badge.innerHTML = '<span class="skip-badge">Skipped</span>';
  } else {
    const p = PRODUCTS.find(x => x.id === productId);
    badge.innerHTML = `<span class="assignment-badge">→ ${p ? p.brandSlug+' · '+p.name : productId}</span>`;
  }
  updateProgress();
  // Auto-scroll to next unassigned
  const next = keys.findIndex((k, idx) => idx > i && !assignments[k]);
  if (next >= 0) {
    document.getElementById('gc-'+next)?.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function clearGroup(i, key) {
  delete assignments[key];
  const card = document.getElementById('gc-'+i);
  card.className = 'group-card';
  document.getElementById('badge-'+i).innerHTML = '';
  updateProgress();
}

function updateProgress() {
  const assigned = Object.values(assignments).filter(v => v && v !== 'skip').length;
  const skipped = Object.values(assignments).filter(v => v === 'skip').length;
  const total = keys.length;
  document.getElementById('progress').textContent =
    `${assigned} assigned · ${skipped} skipped · ${total - assigned - skipped} remaining`;
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeExport(); } });

// ── Export ────────────────────────────────────────────────────────────────────
function openExport() {
  // Build updated catalog: for each product, collect all assigned images in group order
  const imagesByProduct = {};
  PRODUCTS.forEach(p => imagesByProduct[p.id] = []);

  keys.forEach(key => {
    const pid = assignments[key];
    if (pid && pid !== 'skip' && imagesByProduct[pid]) {
      groups[key].forEach(f => imagesByProduct[pid].push(f));
    }
  });

  const updated = PRODUCTS.map(p => ({
    ...p,
    images: imagesByProduct[p.id]
  }));

  document.getElementById('output-json').textContent = JSON.stringify(updated, null, 2);
  document.getElementById('output-area').classList.add('open');
}
function closeExport() {
  document.getElementById('output-area').classList.remove('open');
}
function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output-json').textContent)
    .then(() => alert('Copied! Now paste this into src/data/catalog.json'));
}

boot();
</script>
